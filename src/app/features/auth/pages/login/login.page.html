<ion-content [fullscreen]="true" class="login-content">
  <div class="login-card">
    <div class="login-brand">
      <img src="assets/icon/logo-mark.png" alt="" class="login-brand__icon" />
      <span class="login-brand__mark">Fya</span>
      <span class="login-brand__name">Créditos</span>
    </div>
    <p class="login-subtitle">Ingresa con tu usuario de asesor de ventas</p>

    <form novalidate (submit)="onSubmit(); $event.preventDefault()">
      <ion-input
        label="Usuario"
        label-placement="stacked"
        fill="outline"
        shape="round"
        autocomplete="username"
        placeholder="Ingresa tu usuario"
        [formField]="loginForm.username"
      ></ion-input>

      <ion-input
        label="Contraseña"
        label-placement="stacked"
        fill="outline"
        shape="round"
        [type]="passwordVisible() ? 'text' : 'password'"
        autocomplete="current-password"
        placeholder="••••••••••••••"
        [formField]="loginForm.password"
      >
        <ion-icon
          slot="end"
          [icon]="passwordVisible() ? eyeOffOutline : eyeOutline"
          [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="togglePasswordVisibility()"
        ></ion-icon>
      </ion-input>

      @if (store.error()) {
        <p class="field-error">{{ store.error() }}</p>
      }

      <ion-button
        expand="block"
        shape="round"
        type="submit"
        class="submit-button"
        [disabled]="loginForm().invalid() || store.loggingIn()"
      >
        @if (store.loggingIn()) {
          <ion-spinner name="circular" aria-label="Ingresando"></ion-spinner>
        } @else {
          <ion-icon [icon]="logInOutline" slot="start"></ion-icon>
          Ingresar
        }
      </ion-button>
    </form>
  </div>
</ion-content>
